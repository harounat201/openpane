<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenPane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #0f172a;
      width: 260px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { width: 14px; height: 14px; }
    .title { font-weight: 600; font-size: 14px; letter-spacing: -0.02em; flex: 1; }
    .badge {
      font-size: 10px;
      font-weight: 600;
      background: #eef2ff;
      color: #6366f1;
      padding: 2px 7px;
      border-radius: 10px;
      letter-spacing: 0.02em;
    }

    /* Stats */
    .stats {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      padding: 10px 12px;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 400;
      color: #0f172a;
      letter-spacing: -0.04em;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 500;
    }
    .stat.wide { grid-column: span 2; }
    .stat.wide .stat-val { font-size: 13px; font-family: inherit; letter-spacing: -0.01em; }

    /* Divider */
    .divider { height: 1px; background: #e2e8f0; margin: 0 16px; }

    /* Actions */
    .actions { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 7px; }
    .btn {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s;
      letter-spacing: -0.01em;
    }
    .btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .btn-primary {
      background: #6366f1;
      color: white;
      border-color: #6366f1;
    }
    .btn-primary:hover { background: #4f46e5; border-color: #4f46e5; }
    .btn-secondary {
      background: #f8fafc;
      color: #374151;
      border-color: #e2e8f0;
    }
    .btn-secondary:hover { background: #f1f5f9; border-color: #cbd5e1; }

    /* Status */
    .status {
      padding: 0 16px 12px;
      font-size: 11.5px;
      color: #94a3b8;
      text-align: center;
    }
    .status.active { color: #22c55e; }
    .status.inactive { color: #f59e0b; }

    /* Loading */
    .loading { padding: 24px 16px; text-align: center; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <span class="title">OpenPane</span>
    <span class="badge">MV3</span>
  </div>

  <div id="content">
    <div class="loading">Loading…</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
